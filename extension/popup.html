<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowAI Guard</title>
    <style>
      body { width: 320px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }
      h2 { margin: 0 0 16px 0; font-size: 18px; color: #111827; }
      input { width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
      button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
      button:hover { background: #1d4ed8; }
      .status { margin-top: 16px; padding: 12px; background: #f3f4f6; border-radius: 6px; font-size: 14px; color: #4b5563; }
      .error { color: #dc2626; font-size: 12px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/popup.tsx"></script>
  </body>
</html>
